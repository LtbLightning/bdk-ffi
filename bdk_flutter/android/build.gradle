plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.bitcoindevkit.bdk_flutter"
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

tasks.register("buildBdkRust") {
    doLast {
        def script = "${project.projectDir}/scripts/build_android_libs.sh"
        exec {
            executable "bash"
            args "-c", "chmod +x '${script}' && '${script}'"
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("buildBdkRust")
}


